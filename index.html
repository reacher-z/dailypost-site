<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>访问受限</title><style>html,body{margin:0;min-height:100%;background:#f5f5f7;color:#38383e;font:14px system-ui,-apple-system,sans-serif}#gate{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.access{width:min(340px,100%);text-align:center}.mark{height:45px;width:45px;margin:0 auto 22px;background:#fff;border:1px solid #e0e0e7;border-radius:14px;display:grid;place-items:center;color:#888}h1{font-size:21px;font-weight:500;letter-spacing:.5px;margin:0 0 12px}p{font-size:12px;color:#9a9aa3;margin:0 0 27px}input{width:100%;box-sizing:border-box;background:white;border:1px solid #dddde5;border-radius:8px;padding:13px;font:13px system-ui;outline:none}input:focus{border-color:#9992b2}button{border:0;width:100%;margin-top:11px;padding:13px;border-radius:8px;background:#39383e;color:white;font:12px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#message{font-size:11px;color:#a36d77;margin-top:15px;min-height:18px}.mark svg{height:20px;width:20px}</style></head><body><div id="root"></div><div id="gate"><form class="access" id="access-form"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div><h1>访问受限</h1><p>请输入访问令牌。</p><input id="token" type="password" aria-label="访问令牌" placeholder="访问令牌" autocomplete="off" required maxlength="200"><button id="unlock" type="submit">继续</button><div id="message" role="status"></div></form></div><script type="module">const form=document.getElementById('access-form'),button=document.getElementById('unlock'),message=document.getElementById('message');const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='';const token=document.getElementById('token').value;try{const response=await fetch('./payload.json',{cache:'no-store'});if(!response.ok)throw Error();const vault=await response.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(token),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(vault.salt),iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(vault.iv)},key,bytes(vault.cipher));const decoded=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const payload=JSON.parse(decoded);window.__PRIVATE_BOOT__={apiBase:payload.apiBase,token};const style=document.createElement('style');style.textContent=payload.css;document.head.append(style);const moduleURL=URL.createObjectURL(new Blob([payload.js],{type:'text/javascript'}));await import(moduleURL);URL.revokeObjectURL(moduleURL);document.getElementById('gate').remove();}catch{message.textContent='无法解锁，请检查令牌后重试。';button.disabled=false;}});</script></body></html>
